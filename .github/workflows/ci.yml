name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: padz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        node-version: [22.x]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/padz?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            Back/package-lock.json
            Front/package-lock.json

      - name: Install backend dependencies
        working-directory: Back
        run: npm ci

      - name: Generate Prisma client
        working-directory: Back
        run: npx prisma generate

      - name: Apply Prisma migrations
        working-directory: Back
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Build backend
        working-directory: Back
        run: npm run build

      - name: Run backend lint if present
        working-directory: Back
        run: npm run lint --if-present

      - name: Run backend tests if present
        working-directory: Back
        run: npm test --if-present

      - name: Install frontend dependencies
        working-directory: Front
        run: npm ci

      - name: Build frontend
        working-directory: Front
        run: npm run build

      - name: Run frontend lint if present
        working-directory: Front
        run: npm run lint --if-present

      - name: Run frontend tests if present
        working-directory: Front
        run: npm test --if-present

      - name: Audit backend dependencies
        working-directory: Back
        run: npm audit --audit-level=moderate || true
