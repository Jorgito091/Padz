name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: padz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: [18.x]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/padz?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: Back
        run: npm ci

      - name: Generate Prisma client
        working-directory: Back
        run: npx prisma generate

      - name: Check Prisma migrations status
        working-directory: Back
        run: npx prisma migrate status --schema=prisma/schema.prisma || true

      - name: Build backend
        working-directory: Back
        run: npm run build

      - name: Install frontend dependencies
        working-directory: Front
        run: npm ci

      - name: Build frontend
        working-directory: Front
        run: npm run build

      - name: Audit backend dependencies
        working-directory: Back
        run: npm audit --audit-level=moderate || true

      - name: Upload build artifacts (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: back-dist
          path: Back/dist
name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        project: [Back, Front]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies in ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Fix npm audit
        working-directory: ${{ matrix.project }}
        run: npm audit fix || echo "No fixable issues"

      - name: Run npm audit
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        working-directory: ${{ matrix.project }}
        run: npm outdated || echo "No outdated packages"

      - name: Run lint (if configured)
        working-directory: ${{ matrix.project }}
        run: npm run lint || echo "No lint script defined"

      - name: Run tests (if configured)
        working-directory: ${{ matrix.project }}
        run: npm test || echo "No test script defined"
