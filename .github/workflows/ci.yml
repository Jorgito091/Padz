name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        project: [Back, Front]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies in ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Fix npm audit
        working-directory: ${{ matrix.project }}
        run: npm audit fix || echo "No fixable issues"

      - name: Run npm audit
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        working-directory: ${{ matrix.project }}
        run: npm outdated || echo "No outdated packages"

      - name: Run lint (if configured)
        working-directory: ${{ matrix.project }}
        run: npm run lint || echo "No lint script defined"

      - name: Run tests (if configured)
        working-directory: ${{ matrix.project }}
        run: npm test || echo "No test script defined"
